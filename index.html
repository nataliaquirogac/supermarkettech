<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SupermarketTech</title>
<meta name="description" content="Plataforma omnicanal de SupermarketTech: inventario en tiempo real, entrega o pickup, recomendaciones personalizadas y abastecimiento B2B.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8f6; --surface:#ffffff; --surface-2:#eef5f1; --line:#d9e7e0;
  --ink:#173a30; --ink-2:#4b6158; --muted:#7a8c84;
  --teal:#4fc7b8; --teal-ink:#127a6d; --lime:#a6df8f;
  --warn:#c9822b; --warn-bg:#fbf1e3; --bad:#c25b5b; --bad-bg:#f9e9e9; --ok-bg:#e3f5ef;
  --shadow:0 1px 2px rgba(23,58,48,.06),0 4px 16px rgba(23,58,48,.06);
  --radius:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1b17; --surface:#16251f; --surface-2:#1c2f28; --line:#284139;
    --ink:#e6f2ec; --ink-2:#b3c7be; --muted:#83988f;
    --teal:#4fc7b8; --teal-ink:#7fe0d3; --lime:#a6df8f;
    --warn:#e3a457; --warn-bg:#2e2416; --bad:#e08585; --bad-bg:#321d1d; --ok-bg:#163029;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1b17; --surface:#16251f; --surface-2:#1c2f28; --line:#284139;
  --ink:#e6f2ec; --ink-2:#b3c7be; --muted:#83988f;
  --teal:#4fc7b8; --teal-ink:#7fe0d3; --lime:#a6df8f;
  --warn:#e3a457; --warn-bg:#2e2416; --bad:#e08585; --bad-bg:#321d1d; --ok-bg:#163029;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal-ink)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}

/* Header */
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.01em;margin-right:auto;white-space:nowrap}
.logo .mark{width:30px;height:30px;border-radius:50%;border:6px solid var(--lime);display:inline-block}
.ctrl{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px}
.ctrl select{border:0;background:transparent;font-weight:600;outline:none;max-width:160px}
.ctrl label{color:var(--muted)}
.cartbtn{position:relative;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:9px 16px;font-weight:700;display:flex;gap:8px;align-items:center}
.cartbtn .n{background:var(--teal);color:#0d2a23;border-radius:999px;padding:0 7px;font-size:12px;min-width:20px;text-align:center}
.pts{font-weight:700;color:var(--teal-ink)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:transparent;border:0;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--ink-2);white-space:nowrap}
nav.tabs button.on{background:var(--ink);color:var(--bg)}
nav.tabs button:not(.on):hover{background:var(--surface-2)}

main{padding:24px 0 80px}
h1,h2,h3{margin:0;letter-spacing:-.015em}
h1{font-size:clamp(26px,4vw,40px);line-height:1.1;font-weight:800}
h2{font-size:22px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-ink)}
.sub{color:var(--ink-2)}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec{margin-top:32px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card.soft{background:var(--surface-2);box-shadow:none}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#0d2a23}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--teal-ink)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.neu{background:var(--surface-2);color:var(--ink-2)}
.chip.dark{background:var(--ink);color:var(--bg)}

/* Hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:stretch}
.hero .lead{background:var(--ink);color:#eaf6f1;border-radius:22px;padding:28px;position:relative;overflow:hidden}
.hero .lead h1{color:#fff}
.hero .lead .eyebrow{color:var(--lime)}
.hero .lead p{color:#c4ddd3;max-width:520px}
.hero .lead::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:34px solid rgba(166,223,143,.18)}
.pillars{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pillar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.pillar .ic{font-size:22px}
.pillar b{display:block;margin-top:6px}
.pillar span{font-size:13px;color:var(--ink-2)}
@media (max-width:820px){.hero{grid-template-columns:1fr}}

/* Products */
.prod{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative}
.prod .em{font-size:40px;line-height:1;height:64px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border-radius:10px}
.prod .nm{font-weight:700;font-size:14px;line-height:1.25}
.prod .unit{font-size:12px;color:var(--muted)}
.prod .price{font-weight:800;font-size:17px}
.prod .old{color:var(--muted);text-decoration:line-through;font-size:12px;font-weight:500;margin-left:4px}
.prod .why{font-size:12px;color:var(--teal-ink);font-weight:600}
.prod .row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.stock{font-size:12px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.stepper button{border:0;background:var(--surface-2);width:30px;height:30px;font-weight:800}
.stepper span{min-width:28px;text-align:center;font-weight:700;font-size:14px}
.add{border:0;background:var(--teal);color:#0d2a23;border-radius:999px;height:32px;padding:0 14px;font-weight:700}
.add:disabled{background:var(--surface-2);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 16px;outline:none}
.search:focus{border-color:var(--teal)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(79,199,184,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,199,184,.6)}70%{box-shadow:0 0 0 8px rgba(79,199,184,0)}100%{box-shadow:0 0 0 0 rgba(79,199,184,0)}}
.flash{animation:flash 1.2s}
@keyframes flash{0%{background:var(--warn-bg)}100%{background:transparent}}

/* Coupons */
.coupon{border:1.5px dashed var(--teal);border-radius:14px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.coupon .v{font-size:22px;font-weight:800;color:var(--teal-ink)}
.coupon.used{opacity:.5}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,25,20,.45);z-index:40;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--bg);z-index:50;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}
.drawer .db{padding:16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.drawer .df{padding:16px;border-top:1px solid var(--line);background:var(--surface)}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px}
.line{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center}
.line .em{font-size:26px;text-align:center}
.line select{font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:3px 6px;margin-top:4px;max-width:100%}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);cursor:pointer}
.opt.on{border-color:var(--teal);background:var(--ok-bg)}
.opt input{margin-top:3px;accent-color:var(--teal)}
.tot{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.tot.big{font-size:18px;font-weight:800;padding-top:8px;border-top:1px solid var(--line);margin-top:6px}
.tot .g{color:var(--teal-ink);font-weight:600}

/* Orders */
.steps{display:flex;gap:0;margin:14px 0 6px}
.steps .s{flex:1;text-align:center;font-size:11px;color:var(--muted);position:relative;padding-top:18px}
.steps .s::before{content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:var(--line);z-index:1}
.steps .s::after{content:"";position:absolute;top:9px;left:-50%;width:100%;height:2px;background:var(--line)}
.steps .s:first-child::after{display:none}
.steps .s.done{color:var(--ink);font-weight:600}
.steps .s.done::before,.steps .s.done::after{background:var(--teal)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tscroll{overflow-x:auto}
input.num{width:72px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface)}
input.field,select.field,textarea.field{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);outline:none}
.fl{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2)}
.kpi{font-size:28px;font-weight:800;letter-spacing:-.02em}
.meter{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal);border-radius:999px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;transition:transform .25s;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.on{transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.banner{background:var(--ink);color:#eaf6f1;border-radius:14px;padding:14px 18px;font-weight:600}
.tier{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tier:last-child{border:0}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:70;padding:16px;background:rgba(10,25,20,.5)}
.modal.on{display:flex}
.modal .card{width:min(460px,100%);max-height:90vh;overflow:auto}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:13px}
@media (max-width:600px){
  .ctrl select{max-width:110px}
  .pillars{grid-template-columns:1fr}
  .hide-m{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="logo"><span class="mark"></span>SupermarketTech</div>
      <div class="ctrl"><label for="selProfile">Perfil</label><select id="selProfile"></select></div>
      <div class="ctrl"><label for="selStore">📍</label><select id="selStore"></select></div>
      <div class="ctrl hide-m"><span class="pts" id="hdrPts">0</span><span class="muted">pts</span></div>
      <button class="cartbtn" data-act="openCart">🛒 Carrito <span class="n" id="cartN">0</span></button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap" id="view"></main>

<footer><div class="wrap">SupermarketTech · Prototipo de plataforma omnicanal (proyecto académico). Datos de demostración guardados solo en este navegador. <button class="btn sm" data-act="reset">Reiniciar demo</button></div></footer>

<div class="scrim" id="scrim" data-act="closeCart"></div>
<aside class="drawer" id="drawer" aria-label="Carrito"></aside>
<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ DATA ============ */
const STORES = {
  centro:{name:'Sucursal Centro', pick:'Listo en 45 min'},
  norte:{name:'Sucursal Norte', pick:'Listo en 60 min'},
  sur:{name:'Sucursal Sur', pick:'Listo en 50 min'}
};
const CATS = ['Frutas y verduras','Carnes y pescados','Lácteos y huevo','Panadería','Despensa','Listos para comer','Bebidas','Limpieza y hogar'];
// id, nombre, emoji, categoría, precio, unidad, stock base, apto B2B
const RAW = [
 ['p01','Aguacate Hass','🥑',0,89,'kg',60,1],['p02','Jitomate saladet','🍅',0,32,'kg',90,1],['p03','Plátano','🍌',0,26,'kg',80,0],
 ['p04','Manzana roja','🍎',0,49,'kg',70,0],['p05','Lechuga romana','🥬',0,22,'pza',45,1],['p06','Cebolla blanca','🧅',0,29,'kg',85,1],
 ['p07','Limón sin semilla','🍋',0,38,'kg',75,1],['p08','Fresas','🍓',0,65,'500 g',30,1],['p09','Zanahoria','🥕',0,19,'kg',70,1],
 ['p10','Pechuga de pollo','🍗',1,139,'kg',40,1],['p11','Carne molida de res','🥩',1,165,'kg',35,1],['p12','Filete de salmón','🐟',1,329,'kg',18,1],
 ['p13','Camarón mediano','🦐',1,289,'kg',20,1],['p14','Huevo blanco','🥚',2,62,'18 pzas',60,1],['p15','Leche entera','🥛',2,28,'1 L',120,1],
 ['p16','Yogurt griego','🥣',2,45,'1 kg',40,0],['p17','Queso Oaxaca','🧀',2,119,'500 g',35,1],['p18','Mantequilla','🧈',2,58,'225 g',40,1],
 ['p19','Pan de caja integral','🍞',3,48,'680 g',50,0],['p20','Baguette','🥖',3,24,'pza',30,1],['p21','Tortilla de maíz','🫓',3,23,'kg',90,1],
 ['p22','Croissant','🥐',3,18,'pza',36,1],['p23','Arroz grano largo','🍚',4,34,'1 kg',80,1],['p24','Pasta spaghetti','🍝',4,19,'500 g',90,1],
 ['p25','Salsa de tomate','🥫',4,22,'350 g',70,1],['p26','Aceite de oliva','🫒',4,149,'1 L',30,1],['p27','Frijol negro','🫘',4,39,'1 kg',60,1],
 ['p28','Café en grano','☕',4,189,'500 g',25,1],['p29','Avena','🌾',4,42,'1 kg',40,0],['p30','Atún en agua','🐠',4,24,'140 g',100,0],
 ['p31','Ensalada César lista','🥗',5,79,'pza',20,0],['p32','Sándwich de pavo','🥪',5,65,'pza',22,0],['p33','Bowl de pollo teriyaki','🍱',5,99,'pza',18,0],
 ['p34','Sushi roll mixto','🍣',5,119,'10 pzas',12,1],['p35','Pizza margarita (horno)','🍕',5,129,'pza',14,0],['p36','Fruta picada','🍉',5,45,'350 g',25,1],
 ['p37','Agua natural','💧',6,15,'1.5 L',150,1],['p38','Jugo de naranja','🧃',6,39,'1 L',45,1],['p39','Refresco de cola','🥤',6,31,'2 L',90,1],
 ['p40','Vino tinto','🍷',6,229,'750 ml',24,1],['p41','Hielo','🧊',6,35,'5 kg',40,1],['p42','Detergente líquido','🧴',7,129,'3 L',30,0],
 ['p43','Papel de cocina','🧻',7,54,'3 rollos',50,1],['p44','Bolsas compostables','♻️',7,49,'30 pzas',40,1],['p45','Servilletas','🪶',7,36,'500 pzas',45,1]
];
const PRODUCTS = RAW.map(r=>({id:r[0],name:r[1],em:r[2],cat:CATS[r[3]],price:r[4],unit:r[5],base:r[6],b2b:!!r[7]}));
const P = Object.fromEntries(PRODUCTS.map(p=>[p.id,p]));
// complementos para "porque compraste X"
const PAIRS = {p24:['p25','p17'],p25:['p24'],p10:['p23','p05'],p11:['p21','p06'],p21:['p11','p27'],p01:['p07','p02','p21'],p02:['p06','p01'],
  p20:['p26','p40'],p40:['p17','p20'],p28:['p15','p22'],p15:['p29','p28'],p12:['p07','p23'],p13:['p07','p39'],p34:['p38'],p08:['p16'],p16:['p08','p29']};

const PROFILES = {
  hogar:{name:'Hogar / familia',em:'🏠',seg:'B2C',goal:'ahorro y planeación semanal',w:{'Frutas y verduras':3,'Carnes y pescados':2,'Lácteos y huevo':3,'Despensa':3,'Limpieza y hogar':2,'Panadería':1},fav:['p15','p14','p03','p10','p21','p23','p02','p42','p19']},
  estudiante:{name:'Estudiante',em:'🎓',seg:'B2C',goal:'cuidar el presupuesto',w:{'Despensa':3,'Listos para comer':2,'Bebidas':2,'Panadería':2,'Lácteos y huevo':1},fav:['p24','p25','p30','p29','p37','p32','p14','p03']},
  trabajador:{name:'Trabajador',em:'💼',seg:'B2C',goal:'ahorrar tiempo',w:{'Listos para comer':3,'Bebidas':2,'Panadería':1,'Lácteos y huevo':1,'Frutas y verduras':1},fav:['p31','p33','p32','p28','p38','p36','p16']},
  restaurante:{name:'Restaurante',em:'🍽️',seg:'B2B',goal:'calidad consistente y reabasto rápido',w:{'Frutas y verduras':3,'Carnes y pescados':3,'Despensa':2,'Lácteos y huevo':2},fav:['p01','p02','p06','p07','p10','p11','p26','p17','p21']},
  emprende:{name:'Emprendimiento de comida',em:'🏪',seg:'B2B',goal:'margen sin mínimos mayoristas',w:{'Panadería':2,'Lácteos y huevo':2,'Despensa':3,'Frutas y verduras':2},fav:['p22','p18','p14','p15','p28','p08','p20','p44']},
  eventos:{name:'Catering / eventos',em:'🥂',seg:'B2B',goal:'volumen por fecha y buena presentación',w:{'Bebidas':3,'Listos para comer':2,'Frutas y verduras':2,'Limpieza y hogar':2},fav:['p34','p36','p40','p41','p37','p45','p20','p17','p13']}
};

/* ============ STATE ============ */
const KEY='smt_state_v1';
const DAY=864e5;
let S;
function seededRand(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function freshState(){
  const stock={};
  PRODUCTS.forEach((p,i)=>{const r=seededRand(i+7);stock[p.id]={centro:Math.round(p.base*(.5+r())),norte:Math.round(p.base*(.3+r()*.9)),sur:Math.round(p.base*(.2+r()*.8))}});
  // un par de agotados para mostrar la visibilidad entre sucursales

function tierPct(q){if(!isB2B())return 0;return q>=25?.10:q>=10?.05:0}

function history(){return U().orders.filter(o=>o.status>=0)}
function affinity(){
  const cat={},prod={};
  history().forEach(o=>Object.entries(o.items).forEach(([id,q])=>{prod[id]=(prod[id]||0)+1;cat[P[id].cat]=(cat[P[id].cat]||0)+1}));
  return {cat,prod};
}
function recommendations(n=8){
  const {cat,prod}=affinity(), w=PR().w, scores={}, why={};
  const recent=history().slice(-2).flatMap(o=>Object.keys(o.items));
  PRODUCTS.forEach(p=>{
    let s=(w[p.cat]||0)*1.5+(cat[p.cat]||0)*.4;
    if(isB2B()&&!p.b2b) s-=4;
    if(prod[p.id]) {s+=prod[p.id]*.6; why[p.id]='Lo compras seguido'}
    scores[p.id]=s;
  });
  recent.forEach(id=>(PAIRS[id]||[]).forEach(c=>{scores[c]+=3;if(!prod[c]||!why[c]) why[c]='Combina con '+P[id].name.toLowerCase()}));
  Object.keys(S.cart).forEach(id=>(PAIRS[id]||[]).forEach(c=>{if(!S.cart[c]){scores[c]+=4;why[c]='Va con lo de tu carrito'}}));
  return PRODUCTS.filter(p=>stockAt(p.id)>0&&!S.cart[p.id]).sort((a,b)=>scores[b.id]-scores[a.id]).slice(0,n)
    .map(p=>({p,why:why[p.id]||'Popular para '+PR().name.toLowerCase()}));
}
// predicción de reposición: intervalo promedio entre compras del mismo producto
function replenish(){
  const seen={};
  history().forEach(o=>Object.entries(o.items).forEach(([id,q])=>{(seen[id]=seen[id]||[]).push({t:o.date,q})}));
  const out=[];
  Object.entries(seen).forEach(([id,arr])=>{
    if(arr.length<2)return;
    arr.sort((a,b)=>a.t-b.t);
    const gaps=arr.slice(1).map((x,i)=>x.t-arr[i].t), avg=gaps.reduce((a,b)=>a+b,0)/gaps.length;
    const next=arr[arr.length-1].t+avg, days=Math.round((next-Date.now())/DAY);
    const q=Math.round(arr.reduce((a,b)=>a+b.q,0)/arr.length);
    if(days<=3) out.push({id,days,q,every:Math.round(avg/DAY)});
  });
  return out.sort((a,b)=>a.days-b.days);
}
function coupons(){
  const {cat}=affinity(), top=Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const k=S.profile, list=[];

  list.push({id:'cat-'+c1,label:`15% en ${c1}`,desc:'Tu categoría más comprada',type:'cat',cat:c1,pct:.15});
  if(k==='estudiante') list.push({id:'est30',label:'$40 de descuento',desc:'En compras desde $300 · beneficio estudiante',type:'fix',amt:40,min:300});
  else if(k==='trabajador') list.push({id:'exp0',label:'Envío express gratis',desc:'Recibe en 60 min sin costo',type:'ship'});
  else if(isB2B()) list.push({id:'b2b8',label:'8% extra por volumen',desc:'En pedidos desde $2,500',type:'pct',pct:.08,min:2500});
  else list.push({id:'hog10',label:'10% en tu despensa',desc:'En compras desde $800',type:'pct',pct:.10,min:800});
  const c2=top[1]; if(c2) list.push({id:'cat2-'+c2,label:`10% en ${c2}`,desc:'Basado en tu historial',type:'cat',cat:c2,pct:.10});
  return list.map(c=>({...c,used:U().usedCoupons.includes(c.id)}));
}

function cartLines(){return Object.entries(S.cart).filter(([,q])=>q>0).map(([id,q])=>({p:P[id],q}))}
function totals(){
  const lines=cartLines(); let sub=0,tier=0;
  lines.forEach(({p,q})=>{sub+=p.price*q;tier+=p.price*q*tierPct(q)});
  const c=S.co, cp=c.coupon&&coupons().find(x=>x.id===c.coupon&&!x.used);
  let disc=0, cpNote='';
  if(cp){
    if(cp.type==='cat') disc=lines.filter(l=>l.p.cat===cp.cat).reduce((a,l)=>a+l.p.price*l.q,0)*cp.pct;
    else if(cp.type==='pct'&&sub>=cp.min) disc=(sub-tier)*cp.pct;
    else if(cp.type==='fix'&&sub>=cp.min) disc=cp.amt;
    if(cp.min&&sub<cp.min) cpNote=`Te faltan ${money(cp.min-sub)} para usar este cupón`;
  }
  let fee=0;
  if(c.mode==='envio'){fee=c.slot==='express'?59:29; if(sub>=799&&c.slot!=='express') fee=0; if(cp&&cp.type==='ship'&&c.slot==='express') fee=0}
  if(c.mode==='b2b') fee=sub>=1500?0:99;
  const eco=c.eco?5:0;
  let total=Math.max(0,sub-tier-disc+fee+eco);
  const wallet=c.useWallet?Math.min(U().wallet,total):0; total-=wallet;
  const pts=Math.floor(total/10)+(c.eco?30:0);
  return {lines,sub,tier,disc,fee,eco,wallet,total,pts,cp,cpNote,saved:tier+disc+(cp&&cp.type==='ship'&&c.mode==='envio'&&c.slot==='express'?59:0)};
}
function addToCart(id,d=1){

  if(nq===0) {delete S.cart[id];delete S.subs[id]} else S.cart[id]=nq;

}

// disponibilidad proyectada: stock de todas las sucursales + reabasto de proveedor cada 3 días
function planCheck(){
  const plan=S.plan||{items:{},date:''}, d=plan.date?new Date(plan.date+'T12:00').getTime():0, lines={};
  let total=0,saved=0,late=0;
  Object.entries(plan.items).forEach(([id,q])=>{
    if(!q)return; const p=P[id], pct=isB2B()?(q>=25?.1:q>=10?.05:0):0;
    total+=p.price*q*(1-pct); saved+=p.price*q*pct;
    const have=Object.values(S.stock[id]).reduce((a,b)=>a+b,0), need=Math.max(0,q-have);
    const eta=Date.now()+(need?Math.ceil(need/Math.max(10,p.base))*3*DAY:0);
    lines[id]={ok:need===0,need,eta};
    if(d&&eta>d) late=Math.max(late,eta);
  });
  return {lines,total,saved,late};
}
function weeklyUse(){
  const arr={};
  history().forEach(o=>Object.entries(o.items).forEach(([id,q])=>{arr[id]=(arr[id]||0)+q}));
  const weeks=Math.max(1,(Date.now()-Math.min(...history().map(o=>o.date)))/(7*DAY));
  const top=Object.keys(arr).map(id=>({id,w:arr[id]/weeks})).sort((a,b)=>b.w-a.w).slice(0,4);
  const max=top[0]?top[0].w:1;
  return top.length?top.map(t=>`<div style="margin-top:10px"><div class="small" style="display:flex;justify-content:space-between"><span>${P[t.id].em} ${esc(P[t.id].name)}</span><b>${t.w.toFixed(1)}/sem</b></div><div class="meter"><i style="width:${t.w/max*100}%"></i></div></div>`).join('')
    +`<button class="btn sm" style="margin-top:12px" data-act="planFromUse">Usar como base del pedido</button>`:'<div class="small muted">Sin historial suficiente.</div>';
}

function checkout(){
  const t=totals(); if(!t.lines.length)return;
  // validar contra inventario en vivo (pudo cambiar mientras compraba)
  const subs=[];
  t.lines.forEach(({p,q})=>{const n=stockAt(p.id); if(q>n){subs.push({p,q,n,pref:S.subs[p.id]||'similar'})}});
  const items={};
  t.lines.forEach(({p,q})=>{const n=stockAt(p.id), take=Math.min(q,n); if(take) items[p.id]=take; S.stock[p.id][S.store]-=take});
  const u=U(), c=S.co;
  const o=mkOrder(items,{mode:c.mode,store:S.store,date:Date.now(),status:0,profile:S.profile,slot:c.slot});
  o.sub=t.sub; o.discount=t.tier+t.disc; o.fee=t.fee; o.total=t.total;
  u.orders.push(o); u.points+=t.pts; u.wallet-=t.wallet;
  if(c.eco) u.eco.ecoPack++;
  if(t.cp) u.usedCoupons.push(t.cp.id);
  S.cart={}; S.subs={}; c.coupon=null; c.eco=false;
  save(); closeCart(); S.tab='pedidos'; renderHeader(); renderView();
  modal(`<div class="eyebrow">Pedido confirmado</div><h2 style="margin:6px 0 10px">${o.id}</h2>
    <p class="sub">${o.mode==='pickup'?`Recógelo en ${STORES[o.store].name}. ${STORES[o.store].pick}.`:o.mode==='b2b'?'Entrega a tu negocio mañana de 7:00 a 9:00.':o.slot==='express'?'Llega en aproximadamente 60 minutos.':'Llega en el horario '+esc(o.slot)+'.'}</p>
    ${subs.length?`<div class="small" style="background:var(--warn-bg);border-radius:10px;padding:10px;margin:10px 0">El inventario cambió mientras comprabas:<br>${subs.map(s=>`• ${esc(s.p.name)}: solo había ${s.n} de ${s.q} → ${s.pref==='similar'?'te sustituiremos el resto por uno similar':s.pref==='llamar'?'te llamaremos antes de sustituir':'no se cobrará el faltante'}`).join('<br>')}</div>`:''}
    <div class="tot big"><span>Total</span><span>${money(o.total)}</span></div>
    <div class="small" style="color:var(--teal-ink);margin:6px 0 14px">+${t.pts} pts Eco+${t.saved?` · ahorraste ${money(t.saved)}`:''}</div>
    <button class="btn pri" data-act="closeModal">Ver seguimiento</button>`);
}

function sendIssue(id){
  const o=findOrder(id), type=$('#issType').value, prod=$('#issProd').value, u=U();
  let res;
  if(type==='Llegó tarde'){res='Te bonificamos 100 pts y tu siguiente envío programado es gratis.';u.points+=100}
  else{
    const amt=prod?P[prod].price*o.items[prod]:Math.round(o.total*.1);
    u.wallet+=amt; res=`Reembolsamos ${money(amt)} como saldo a favor.${type==='Producto en mal estado'?' Calidad revisará el lote en la sucursal.':''}`;
  }
  o.issues.push({type,prod,res}); save(); closeModal(); renderHeader(); renderView(); toast('Problema resuelto: '+res);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act, id=b.dataset.id;
  switch(a){
    case 'tab': S.tab=b.dataset.v; save(); renderHeader(); renderView(); window.scrollTo(0,0); break;
    case 'tabClose': closeCart(); S.tab=b.dataset.v; save(); renderHeader(); renderView(); break;
    case 'inc': addToCart(id,1); break;
    case 'dec': addToCart(id,-1); break;
    case 'incN': addToCart(id,+b.dataset.n); toast(`${P[id].name} agregado`); break;
    case 'addRep': replenish().forEach(r=>addToCart(r.id,r.q)); toast('Reposición agregada al carrito'); break;
    case 'cat': S.cat=b.dataset.v; renderView(); break;
    case 'openCart': openCart(); break;
    case 'closeCart': closeCart(); break;
    case 'closeModal': closeModal(); break;
    case 'checkout': checkout(); break;
    case 'useCoupon': S.co.coupon=id; save(); renderView(); toast('Cupón activado en tu carrito'); break;
    case 'reorder': {const o=findOrder(id); Object.entries(o.items).forEach(([pid,q])=>addToCart(pid,q)); openCart(); break}
    case 'advance': {const o=findOrder(id,b.dataset.who); if(o.status<3)o.status++; if(o.status===3&&o.mode==='pickup'){}; save(); renderView(); break}
    case 'issue': issueModal(id); break;
    case 'sendIssue': sendIssue(id); break;
    case 'listToCart': {const l=U().lists[+b.dataset.i]; Object.entries(l.items).forEach(([pid,q])=>addToCart(pid,q)); openCart(); break}
    case 'delList': U().lists.splice(+b.dataset.i,1); save(); renderView(); break;
    case 'saveCartList': modal(`<h2>Guardar lista</h2><label class="fl" style="margin:12px 0">Nombre<input class="field" id="listName" value="Mi lista ${U().lists.length+1}"></label><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" data-act="doSaveList">Guardar</button></div>`); break;
    case 'doSaveList': U().lists.push({name:$('#listName').value||'Mi lista',items:{...S.cart}}); save(); closeModal(); renderView(); toast('Lista guardada'); break;
    case 'eco': {const u=U(); if(b.dataset.v==='bags'){u.eco.bags++;u.points+=20;toast('+20 pts por traer tus bolsas')} else {const n=Math.max(1,+$('#recN').value||0);u.eco.recycled+=n;u.points+=n*5;toast(`+${n*5} pts por reciclar ${n} envases`)} save(); renderHeader(); renderView(); break}
    case 'redeem': {const u=U(), pts=+b.dataset.pts; if(u.points<pts)return; u.points-=pts; u.wallet+=+b.dataset.val; save(); renderHeader(); renderView(); toast(`Canjeado: ${money(+b.dataset.val)} de saldo a favor`); break}
    case 'restock': S.stock[id][S.store]+=20; save(); renderView(); toast(`${P[id].name}: +20 en anaquel`); break;
    case 'setProfile': S.profile=b.dataset.v; S.cart={}; save(); renderHeader(); renderView(); break;
    case 'kit': {const g=+($('#guests')||{}).value||0; if(!g){toast('Escribe el número de invitados');break}
      const per={p34:.25,p36:.15,p40:.2,p41:.1,p37:.5,p45:.05,p20:.1,p17:.04}; S.plan.items={};
      Object.entries(per).forEach(([pid,f])=>S.plan.items[pid]=Math.max(1,Math.ceil(g*f))); save(); renderView(); toast(`Cantidades sugeridas para ${g} invitados`); break}
    case 'planFromUse': {const arr={}; history().forEach(o=>Object.entries(o.items).forEach(([pid,q])=>arr[pid]=(arr[pid]||0)+q));
      const weeks=Math.max(1,(Date.now()-Math.min(...history().map(o=>o.date)))/(7*DAY));
      S.plan.items={}; Object.entries(arr).forEach(([pid,q])=>{if(P[pid].b2b)S.plan.items[pid]=Math.ceil(q/weeks)}); save(); renderView(); toast('Pedido base cargado con tu consumo semanal'); break}
    case 'confirmPlan': {const ck=planCheck(), u=U(), items={};
      Object.entries(S.plan.items).forEach(([pid,q])=>{if(q)items[pid]=q});
      const o=mkOrder(items,{mode:'b2b',store:S.store,date:Date.now(),status:-1,profile:S.profile,forDate:new Date(S.plan.date+'T12:00').getTime()});
      o.total=ck.total; o.discount=ck.saved; o.recur=S.plan.recur;
      u.orders.push(o); u.scheduled.push({forDate:o.forDate,recur:S.plan.recur,total:ck.total}); u.points+=Math.floor(ck.total/10);
      S.plan={date:'',recur:'una',items:{}}; save(); renderHeader(); renderView();
      modal(`<div class="eyebrow">Pedido programado</div><h2 style="margin:6px 0 10px">${o.id}</h2><p class="sub">Apartamos el inventario para el ${fmtDate(o.forDate)}${o.recur!=='una'?` y se repetirá de forma ${o.recur}`:''}. Te avisamos 24 h antes para confirmar cantidades.</p><div class="tot big"><span>Total</span><span>${money(o.total)}</span></div><button class="btn pri" style="margin-top:12px" data-act="closeModal">Listo</button>`); break}
    case 'reset': if(confirm('¿Reiniciar todos los datos de la demo?')){S=freshState();save();closeCart();renderHeader();renderView()} break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='selProfile'){S.profile=t.value;S.co.coupon=null;save();renderHeader();renderView();if($('#drawer').classList.contains('on'))renderCart();return}
  if(t.id==='selStore'){S.store=t.value;
    Object.keys(S.cart).forEach(id=>{const n=stockAt(id);if(S.cart[id]>n){if(n)S.cart[id]=n;else delete S.cart[id]}});
    save();renderHeader();renderView();toast('Mostrando inventario de '+STORES[S.store].name);return}
  if(t.dataset.mode){S.co.mode=t.dataset.mode;if(t.dataset.slot)S.co.slot=t.dataset.slot==='prog'?'Mañana 9:00–11:00':'express';save();renderCart();return}
  if(t.hasAttribute('data-slotsel')){S.co.slot=t.value;save();renderCart();return}
  if(t.hasAttribute('data-eco')){S.co.eco=t.checked;save();renderCart();return}
  if(t.hasAttribute('data-coupon')){S.co.coupon=t.value||null;save();renderCart();return}
  if(t.dataset.sub){S.subs[t.dataset.sub]=t.value;save();return}
  if(t.id==='planDate'){S.plan.date=t.value;save();renderView();return}
  if(t.id==='planRecur'){S.plan.recur=t.value;save();return}
  if(t.dataset.plan){const q=Math.max(0,parseInt(t.value)||0);S.plan.items[t.dataset.plan]=q;save();renderView();return}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;renderView()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeCart();closeModal()}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* Inventario en vivo: otras compras y reabastos simulados cambian el stock */
setInterval(()=>{
  const r=Math.random, changed=[];
  for(let i=0;i<3;i++){
    const p=PRODUCTS[Math.floor(r()*PRODUCTS.length)], st=Object.keys(STORES)[Math.floor(r()*3)];
    if(r()<.75){S.stock[p.id][st]=Math.max(0,S.stock[p.id][st]-Math.ceil(r()*3))} else S.stock[p.id][st]+=Math.ceil(r()*6);
    if(st===S.store) changed.push(p.id);
  }
  S.lastTick=Date.now(); save();
  if(['inicio','catalogo','tienda'].includes(S.tab)&&!document.activeElement.matches('input,select,textarea')){
    renderView(); changed.forEach(id=>{const el=document.querySelector(`.prod[data-pid="${id}"] .stock`);if(el)el.classList.add('flash')});
  }
},15000);
setInterval(()=>{document.querySelectorAll('.live').forEach(el=>{const s=Math.max(1,Math.round((Date.now()-S.lastTick)/1000));el.lastChild.textContent=`Inventario en vivo · ${STORES[S.store].name} · actualizado hace ${s}s`})},1000);

load(); renderHeader(); renderView();
</script>
</body>
