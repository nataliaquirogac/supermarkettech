<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SupermarketTech</title>
<meta name="description" content="Súper en línea con disponibilidad real, envío o pickup, recomendaciones personalizadas y abastecimiento para negocios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --bg-2:#f5f6f4; --tile:#f3f4f1; --line:#e4e7e3; --line-2:#d3d8d2;
  --ink:#14211c; --ink-2:#4a5852; --muted:#86918c;
  --brand:#173a30; --brand-2:#21503f; --accent:#2fae9e; --accent-ink:#11786b; --lime:#a6df8f;
  --sale:#c2410c; --sale-bg:#fdf1ea; --warn:#b26a12; --bad:#b42318;
  --on-brand:#ffffff;
  --radius:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1513; --bg-2:#151d1a; --tile:#1b2421; --line:#25302c; --line-2:#33403b;
    --ink:#eef3f0; --ink-2:#b5c1bc; --muted:#7f8c87;
    --brand:#1e4a3d; --brand-2:#27604f; --accent:#4fc7b8; --accent-ink:#6fd8ca;
    --sale:#f08a5d; --sale-bg:#2a1b14; --warn:#e0a24f; --bad:#f07a6e;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1513; --bg-2:#151d1a; --tile:#1b2421; --line:#25302c; --line-2:#33403b;
  --ink:#eef3f0; --ink-2:#b5c1bc; --muted:#7f8c87;
  --brand:#1e4a3d; --brand-2:#27604f; --accent:#4fc7b8; --accent-ink:#6fd8ca;
  --sale:#f08a5d; --sale-bg:#2a1b14; --warn:#e0a24f; --bad:#f07a6e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Utility strip */
.strip{background:var(--brand);color:#d7e9e1;font-size:12.5px}
.strip .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;height:36px}
.strip select{background:transparent;border:0;color:#fff;font-weight:600;outline:none;cursor:pointer}
.strip select option{color:#14211c}
.strip .r{display:flex;gap:18px}
@media (max-width:700px){.strip .r{display:none}}

/* Header */
header.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:68px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:-.02em;white-space:nowrap;cursor:pointer;background:none;border:0;padding:0}
.logo .mark{width:24px;height:24px;border-radius:50%;border:5px solid var(--lime)}
.sbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:0 16px;height:44px;min-width:0}
.sbox:focus-within{border-color:var(--accent);background:var(--bg)}
.sbox input{border:0;background:transparent;outline:none;flex:1;min-width:0;height:100%}
.sbox svg{color:var(--muted)}
.hbtn{display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 8px;border-radius:10px;text-align:left;white-space:nowrap}
.hbtn:hover{background:var(--bg-2)}
.hbtn small{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}
.hbtn b{display:block;font-size:13.5px;line-height:1.25}
.cartbtn{display:flex;align-items:center;gap:10px;background:var(--brand);color:var(--on-brand);border:0;border-radius:999px;height:44px;padding:0 16px 0 14px;font-weight:700;white-space:nowrap}
.cartbtn .n{background:var(--lime);color:#14211c;border-radius:999px;font-size:12px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}
nav.tabs{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;height:46px;align-items:stretch}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:0;font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-color:var(--ink)}
nav.tabs button:hover{color:var(--ink)}
@media (max-width:860px){
  .bar{flex-wrap:wrap;height:auto;padding:10px 0;gap:10px}
  .sbox{order:5;flex-basis:100%}
  .hide-m{display:none!important}
  .logo{margin-right:auto}
}

main{padding:28px 0 72px;min-height:60vh}
h1,h2,h3{margin:0;letter-spacing:-.02em}
h1{font-size:clamp(28px,4.2vw,46px);line-height:1.05;font-weight:800}
h2{font-size:21px;font-weight:700}
h3{font-size:15px;font-weight:700}
.sub{color:var(--ink-2)}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec{margin-top:44px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:600;font-size:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.box{border:1px solid var(--line);border-radius:var(--radius);padding:20px;background:var(--bg)}
.box.fill{background:var(--bg-2);border-color:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--bg);border-radius:999px;height:40px;padding:0 18px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-2)}
.btn.light{background:#fff;border-color:#fff;color:#14211c}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.neu{background:var(--muted)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--bg-2);color:var(--ink-2);white-space:nowrap}
.pill.sale{background:var(--sale-bg);color:var(--sale)}
.pill.ok{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent-ink)}

/* Hero */
.hero{display:grid;grid-template-columns:1.1fr 1fr;background:var(--brand);border-radius:20px;overflow:hidden;min-height:340px}
.hero .txt{padding:44px;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:16px}
.hero .txt p{color:#bcd6cb;margin:0;font-size:16px;max-width:420px}
.hero .txt .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.hero .ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.hero .ghost:hover{border-color:#fff}
.hero .pics{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:22px 22px 22px 0}
.hero .pics div{background:#fff;border-radius:14px;overflow:hidden;display:grid;place-items:center}
.hero .pics img{width:100%;height:100%;object-fit:contain;max-height:150px}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hero .txt{padding:28px}.hero .pics{padding:0 22px 22px;grid-template-columns:repeat(4,1fr)}.hero .pics img{max-height:90px}}

/* Benefits row */
.perks{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--radius);margin-top:16px}
.perks div{display:flex;gap:10px;align-items:center;padding:14px 16px;font-size:13.5px;font-weight:600}
.perks div+div{border-left:1px solid var(--line)}
.perks svg{color:var(--accent-ink)}
@media (max-width:820px){.perks{grid-template-columns:1fr 1fr}.perks div:nth-child(3){border-left:0}.perks div:nth-child(n+3){border-top:1px solid var(--line)}}

/* Category rail */
.cats{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.cats::-webkit-scrollbar{display:none}
.cat{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:104px;flex:none;font-size:13px;font-weight:600;text-align:center;line-height:1.2}
.cat .c{width:92px;height:92px;border-radius:50%;background:var(--tile);overflow:hidden;display:grid;place-items:center;border:2px solid transparent;transition:border-color .15s}
.cat:hover .c{border-color:var(--accent)}
.cat img{width:78%;height:78%;object-fit:contain;mix-blend-mode:multiply}

/* Product card */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:22px 16px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(172px,190px);gap:16px;overflow-x:auto;scrollbar-width:thin;padding-bottom:8px}
.prod{display:flex;flex-direction:column;gap:6px;min-width:0}
.ph{position:relative;aspect-ratio:1;background:var(--tile);border-radius:var(--radius);overflow:hidden;display:grid;place-items:center}
.ph img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.ph.cover img{object-fit:cover;mix-blend-mode:normal}
.ph .badge{position:absolute;top:8px;left:8px}
.ph.out img{opacity:.45}
.price{font-weight:800;font-size:18px;letter-spacing:-.01em;margin-top:4px}
.price s{color:var(--muted);font-weight:500;font-size:13px;margin-left:6px}
.prod .nm{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod .unit{font-size:12.5px;color:var(--muted)}
.prod .why{font-size:12px;color:var(--accent-ink);font-weight:600}
.prod .act{margin-top:auto;padding-top:6px}
.addb{width:100%;height:38px;border-radius:999px;border:1.5px solid var(--brand);background:var(--bg);color:var(--brand);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.addb:hover{background:var(--brand);color:var(--on-brand)}
.addb:disabled{border-color:var(--line);color:var(--muted);background:var(--bg-2)}
.stepper{display:flex;align-items:center;justify-content:space-between;height:38px;border-radius:999px;background:var(--brand);color:var(--on-brand);overflow:hidden}
.stepper button{border:0;background:transparent;color:inherit;width:40px;height:100%;display:grid;place-items:center}
.stepper button:hover{background:rgba(255,255,255,.12)}
.stepper span{font-weight:700;font-size:14px}
.stepper.sm{height:32px;width:108px}
.stepper.sm button{width:32px}
.flash{animation:flash 1.4s}
@keyframes flash{0%{color:var(--warn)}100%{color:inherit}}

/* Catalog layout */
.cat-layout{display:grid;grid-template-columns:210px 1fr;gap:32px}
.side{position:sticky;top:132px;align-self:start;display:flex;flex-direction:column;gap:2px}
.side button{background:none;border:0;text-align:left;padding:8px 12px;border-radius:8px;font-weight:500;color:var(--ink-2);font-size:14px}
.side button:hover{background:var(--bg-2)}
.side button.on{background:var(--bg-2);color:var(--ink);font-weight:700}
.chips{display:none;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:18px}
.chips button{border:1px solid var(--line-2);background:var(--bg);border-radius:999px;height:34px;padding:0 14px;font-weight:600;font-size:13px;white-space:nowrap}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:860px){.cat-layout{grid-template-columns:1fr}.side{display:none}.chips{display:flex}}
.cat-layout>div{min-width:0}
@media (max-width:520px){.plist{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}.rail{grid-auto-columns:46%}.price{font-size:16px}}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
select.field,input.field,textarea.field{width:100%;border:1px solid var(--line-2);border-radius:10px;height:40px;padding:0 12px;background:var(--bg);outline:none}
textarea.field{height:auto;padding:10px 12px}
select.field:focus,input.field:focus,textarea.field:focus{border-color:var(--accent)}
.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}

/* Coupons */
.coupon{display:flex;flex-direction:column;gap:4px;padding:18px 18px 16px;border:1px solid var(--line);border-radius:var(--radius);position:relative;overflow:hidden}
.coupon::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.coupon .v{font-size:19px;font-weight:800;letter-spacing:-.01em}
.coupon .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.coupon.used{opacity:.5}

/* Mini rows */
.mini{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--radius)}
.mini .ph{width:56px;flex:none;border-radius:10px}
.mini .t{flex:1;min-width:0}
.mini .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:var(--bg);z-index:50;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.db{padding:20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:22px}
.df{padding:18px 20px;border-top:1px solid var(--line)}
.x{border:0;background:var(--bg-2);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.line{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:start}
.line .ph{border-radius:10px}
.line .n{font-size:14px;font-weight:600;line-height:1.3}
.line select{font-size:12px;border:0;background:none;color:var(--muted);padding:0;margin-top:4px;cursor:pointer;max-width:100%}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg-2);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;height:52px;font-weight:600;font-size:13.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.seg button small{font-weight:500;color:var(--muted);font-size:11.5px}
.seg button.on{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.slots{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.slots button{border:1px solid var(--line-2);background:var(--bg);border-radius:8px;height:34px;padding:0 10px;font-size:12.5px;font-weight:600}
.slots button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.check{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;cursor:pointer}
.check small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.switch{appearance:none;width:40px;height:24px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;transition:background .15s;flex:none;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(16px)}
.tot{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;color:var(--ink-2)}
.tot.g span:last-child{color:var(--accent-ink);font-weight:600}
.tot.big{font-size:18px;font-weight:800;color:var(--ink);padding-top:10px}

/* Orders */
.order{border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:14px}
.order .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.thumbs{display:flex;gap:6px}
.thumbs .ph{width:44px;border-radius:8px}
.thumbs .more{width:44px;height:44px;border-radius:8px;background:var(--bg-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-2)}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.track i{height:4px;border-radius:2px;background:var(--line)}
.track i.on{background:var(--accent)}
.order .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.note{font-size:13px;background:var(--bg-2);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center}
.note svg{color:var(--accent-ink)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}
.pcell{display:flex;align-items:center;gap:10px;min-width:200px}
.pcell .ph{width:40px;border-radius:8px;flex:none}
input.num{width:76px;border:1px solid var(--line-2);border-radius:8px;height:34px;padding:0 10px;background:var(--bg)}
.kpi{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.meter{height:6px;background:var(--bg-2);border-radius:999px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,140px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:80;transition:transform .25s;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0)}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:70;padding:16px;background:rgba(10,20,16,.45)}
.modal.on{display:flex}
.modal .mbody{background:var(--bg);border-radius:16px;padding:26px;width:min(440px,100%);max-height:90vh;overflow:auto}
.ok-ic{width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-ink);display:grid;place-items:center;margin-bottom:14px}
.ok-ic svg{width:22px;height:22px}
.pagehead{margin-bottom:24px}
.pagehead h1{font-size:30px}
.pagehead p{margin:6px 0 0;color:var(--ink-2)}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
footer button{background:none;border:0;padding:0;color:var(--ink-2);font-weight:600;font-size:13px}
footer a{color:var(--ink-2)}
</style>
</head>
<body>
<div class="strip"><div class="wrap">
  <label>Ver como <select id="selProfile" aria-label="Tipo de cliente"></select></label>
  <div class="r"><span>Envío gratis desde $799</span><span>Pickup sin costo</span><span>Sin mínimos para negocios</span></div>
</div></div>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <button class="logo" data-act="tab" data-v="inicio"><span class="mark"></span>SupermarketTech</button>
      <label class="sbox"><svg class="i"><use href="#i-search"/></svg><span class="sr">Buscar</span><input id="q" placeholder="Buscar productos" autocomplete="off"></label>
      <button class="hbtn hide-m" data-act="storeModal"><svg class="i"><use href="#i-pin"/></svg><span><small>Tu tienda</small><b id="hdrStore"></b></span></button>

/* ============ DATOS ============ */
const STORES = {

// id, nombre, categoría, precio, precio anterior, unidad, stock base, apto B2B
const RAW = [
 ['p01','Aguacate Hass',0,75,89,'kg',60,1],['p02','Jitomate saladet',0,32,0,'kg',90,1],['p03','Plátano Chiapas',0,26,0,'kg',80,0],

 ['p40','Vino tinto reserva',6,229,269,'750 ml',24,1],['p41','Hielo',6,35,0,'5 kg',40,1],['p42','Detergente líquido Omo',7,129,0,'1 L',30,0],
 ['p43','Toallas de papel',7,54,0,'3 rollos',50,1],['p44','Bolsas compostables',7,49,0,'30 piezas',40,1],['p45','Servilletas',7,36,0,'100 piezas',45,1]
];

const P = Object.fromEntries(PRODUCTS.map(p=>[p.id,p]));
const PAIRS = {p24:['p25','p17'],p25:['p24'],p10:['p23','p05'],p11:['p21','p06'],p21:['p11','p27'],p01:['p07','p02','p21'],p02:['p06','p01'],
  p20:['p26','p40'],p40:['p17','p20'],p28:['p15','p22'],p15:['p29','p28'],p12:['p07','p23'],p13:['p07','p39'],p34:['p38'],p08:['p16'],p16:['p08','p29']};

const PROFILES = {
  hogar:{name:'Hogar',seg:'B2C',w:{'Frutas y verduras':3,'Carnes y pescados':2,'Lácteos y huevo':3,'Despensa':3,'Limpieza y hogar':2,'Panadería y tortillas':1},fav:['p15','p14','p03','p10','p21','p23','p02','p42','p19']},
  estudiante:{name:'Estudiante',seg:'B2C',w:{'Despensa':3,'Listos para comer':2,'Bebidas':2,'Panadería y tortillas':2,'Lácteos y huevo':1},fav:['p24','p25','p30','p29','p37','p32','p14','p03']},
  trabajador:{name:'Trabajador',seg:'B2C',w:{'Listos para comer':3,'Bebidas':2,'Panadería y tortillas':1,'Lácteos y huevo':1,'Frutas y verduras':1},fav:['p31','p33','p32','p28','p38','p36','p16']},
  restaurante:{name:'Restaurante',seg:'B2B',w:{'Frutas y verduras':3,'Carnes y pescados':3,'Despensa':2,'Lácteos y huevo':2},fav:['p01','p02','p06','p07','p10','p11','p26','p17','p21']},
  emprende:{name:'Emprendimiento',seg:'B2B',w:{'Panadería y tortillas':2,'Lácteos y huevo':2,'Despensa':3,'Frutas y verduras':2},fav:['p22','p18','p14','p15','p28','p08','p20','p44']},
  eventos:{name:'Catering y eventos',seg:'B2B',w:{'Bebidas':3,'Listos para comer':2,'Frutas y verduras':2,'Limpieza y hogar':2},fav:['p34','p36','p40','p41','p37','p45','p20','p17','p13']}
};

/* ============ ESTADO ============ */
const KEY='smt_state_v2';
const DAY=864e5;
let S;
function seededRand(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function freshState(){
  const stock={};
  PRODUCTS.forEach((p,i)=>{const r=seededRand(i+7);stock[p.id]={centro:Math.round(p.base*(.5+r())),norte:Math.round(p.base*(.3+r()*.9)),sur:Math.round(p.base*(.2+r()*.8))}});
  stock.p12.centro=0; stock.p08.sur=0; stock.p34.norte=2; stock.p31.centro=3;
  const users={};
  Object.keys(PROFILES).forEach((k,pi)=>{
    const pr=PROFILES[k], r=seededRand(pi*13+3), orders=[];
    const b2b=pr.seg==='B2B', interval=b2b?7:k==='trabajador'?5:9;
    for(let n=4;n>=1;n--){
      const items={};
      pr.fav.forEach(id=>{if(r()<.7) items[id]=b2b?Math.ceil(4+r()*16):Math.ceil(1+r()*2)});
      const date=Date.now()-n*interval*DAY-Math.round(r()*DAY);
      orders.push(mkOrder(items,{mode:n%2?'envio':'pickup',store:'centro',date,status:3,profile:k}));
    }
    users[k]={points:b2b?820:340+pi*60,wallet:0,orders,usedCoupons:[],eco:{bags:b2b?0:3,recycled:b2b?12:8,ecoPack:1},
      lists:[{name:k==='hogar'?'Despensa semanal':b2b?'Pedido base':'Básicos',items:Object.fromEntries(pr.fav.slice(0,6).map(id=>[id,b2b?10:1]))}],
      scheduled:[]};
  });
  return {profile:'hogar',store:'centro',tab:'inicio',cart:{},subs:{},stock,users,
    co:{mode:'envio',slot:'express',eco:false,coupon:null,useWallet:true},cat:'Todo',q:'',sort:'rel',lastTick:Date.now(),plan:{date:'',recur:'una',items:{}}};
}
function mkOrder(items,o){
  const sub=Object.entries(items).reduce((a,[id,q])=>a+P[id].price*q,0);
  return {id:'ST-'+Math.floor(Math.random()*90000+10000),items,sub,total:sub,discount:0,fee:0,mode:o.mode,store:o.store,date:o.date,status:o.status||0,profile:o.profile,issues:[],slot:o.slot||'',forDate:o.forDate||''};
}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.users&&s.stock){S=s;S.plan=S.plan||{date:'',recur:'una',items:{}};return}}catch(e){} S=freshState()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const U=()=>S.users[S.profile];
const PR=()=>PROFILES[S.profile];
const isB2B=()=>PR().seg==='B2B';

/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
const money=n=>'$'+(Math.round(n*100)/100).toLocaleString('es-MX',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=t=>new Date(t).toLocaleDateString('es-MX',{day:'numeric',month:'short'});
const ic=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const img=(id,cls='',extra='')=>`<div class="ph ${COVER.has(id)?'cover':''} ${cls}"><img src="img/${id}.webp" alt="${esc(P[id].name)}" loading="lazy">${extra}</div>`;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2400)}
function stockAt(id,st=S.store){return S.stock[id][st]}
function stockTag(id){
  const n=stockAt(id);
  if(n===0){
    const alt=Object.keys(STORES).filter(s=>s!==S.store&&S.stock[id][s]>0).sort((a,b)=>S.stock[id][b]-S.stock[id][a])[0];
    return `<span class="tag"><span class="dot bad"></span>${alt?`Agotado · hay en ${STORES[alt].name}`:'Agotado'}</span>`;
  }
  if(n<=5) return `<span class="tag"><span class="dot warn"></span>Quedan ${n}</span>`;
  return `<span class="tag"><span class="dot"></span>Disponible</span>`;
}
function tierPct(q){if(!isB2B())return 0;return q>=25?.10:q>=10?.05:0}

/* ============ PERSONALIZACIÓN ============ */
function history(){return U().orders.filter(o=>o.status>=0)}
function affinity(){
  const cat={},prod={};
  history().forEach(o=>Object.keys(o.items).forEach(id=>{prod[id]=(prod[id]||0)+1;cat[P[id].cat]=(cat[P[id].cat]||0)+1}));
  return {cat,prod};
}
function recommendations(n=10){
  const {cat,prod}=affinity(), w=PR().w, scores={}, why={};
  const recent=history().slice(-2).flatMap(o=>Object.keys(o.items));
  PRODUCTS.forEach(p=>{
    let s=(w[p.cat]||0)*1.5+(cat[p.cat]||0)*.4;
    if(isB2B()&&!p.b2b) s-=4;
    if(prod[p.id]){s+=prod[p.id]*.6; why[p.id]='Lo compras seguido'}
    scores[p.id]=s;
  });
  recent.forEach(id=>(PAIRS[id]||[]).forEach(c=>{scores[c]+=3}));
  Object.keys(S.cart).forEach(id=>(PAIRS[id]||[]).forEach(c=>{if(!S.cart[c]){scores[c]+=4;why[c]='Va con tu carrito'}}));
  return PRODUCTS.filter(p=>stockAt(p.id)>0&&!S.cart[p.id]).sort((a,b)=>scores[b.id]-scores[a.id]).slice(0,n)
    .map(p=>({p,why:why[p.id]||''}));
}
function replenish(){
  const seen={};
  history().forEach(o=>Object.entries(o.items).forEach(([id,q])=>{(seen[id]=seen[id]||[]).push({t:o.date,q})}));
  const out=[];
  Object.entries(seen).forEach(([id,arr])=>{
    if(arr.length<2)return;
    arr.sort((a,b)=>a.t-b.t);
    const gaps=arr.slice(1).map((x,i)=>x.t-arr[i].t), avg=gaps.reduce((a,b)=>a+b,0)/gaps.length;
    const days=Math.round((arr[arr.length-1].t+avg-Date.now())/DAY);
    const q=Math.round(arr.reduce((a,b)=>a+b.q,0)/arr.length);
    if(days<=3) out.push({id,days,q,every:Math.round(avg/DAY)});
  });
  return out.sort((a,b)=>a.days-b.days);
}
function coupons(){
  const {cat}=affinity(), top=Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const k=S.profile, list=[];
  const c1=top[0]||'Frutas y verduras';
  list.push({id:'cat-'+c1,label:'15% de descuento',desc:c1,type:'cat',cat:c1,pct:.15});
  if(k==='estudiante') list.push({id:'est40',label:'$40 de descuento',desc:'En compras desde $300',type:'fix',amt:40,min:300});
  else if(k==='trabajador') list.push({id:'exp0',label:'Envío express gratis',desc:'Recibe en 60 minutos',type:'ship'});
  else if(isB2B()) list.push({id:'b2b8',label:'8% adicional',desc:'En pedidos desde $2,500',type:'pct',pct:.08,min:2500});
  else list.push({id:'hog10',label:'10% en tu despensa',desc:'En compras desde $800',type:'pct',pct:.10,min:800});
  const c2=top[1]; if(c2) list.push({id:'cat2-'+c2,label:'10% de descuento',desc:c2,type:'cat',cat:c2,pct:.10});
  return list.map(c=>({...c,used:U().usedCoupons.includes(c.id)}));
}

/* ============ CARRITO ============ */
function cartLines(){return Object.entries(S.cart).filter(([,q])=>q>0).map(([id,q])=>({p:P[id],q}))}
function totals(){
  const lines=cartLines(); let sub=0,tier=0;
  lines.forEach(({p,q})=>{sub+=p.price*q;tier+=p.price*q*tierPct(q)});
  const c=S.co, cp=c.coupon&&coupons().find(x=>x.id===c.coupon&&!x.used);
  let disc=0, cpNote='';
  if(cp){
    if(cp.type==='cat') disc=lines.filter(l=>l.p.cat===cp.cat).reduce((a,l)=>a+l.p.price*l.q,0)*cp.pct;
    else if(cp.type==='pct'&&sub>=cp.min) disc=(sub-tier)*cp.pct;
    else if(cp.type==='fix'&&sub>=cp.min) disc=cp.amt;
    if(cp.min&&sub<cp.min) cpNote=`Agrega ${money(cp.min-sub)} para usarlo`;
  }
  const promo=lines.reduce((a,{p,q})=>a+(p.was?(p.was-p.price)*q:0),0);
  let fee=0;
  if(c.mode==='envio'){fee=c.slot==='express'?59:29; if(sub>=799&&c.slot!=='express') fee=0; if(cp&&cp.type==='ship'&&c.slot==='express') fee=0}
  if(c.mode==='b2b') fee=sub>=1500?0:99;
  const eco=c.eco?5:0;
  let total=Math.max(0,sub-tier-disc+fee+eco);
  const wallet=c.useWallet?Math.min(U().wallet,total):0; total-=wallet;
  const pts=Math.floor(total/10)+(c.eco?30:0);
  return {lines,sub,tier,disc,fee,eco,wallet,total,pts,cp,cpNote,saved:promo+tier+disc};
}
function addToCart(id,d=1,quiet){
  const cur=S.cart[id]||0, max=stockAt(id), nq=Math.max(0,Math.min(max,cur+d));
  if(cur+d>max&&d>0&&!quiet) toast(`Solo hay ${max} en Sucursal ${STORES[S.store].name}`);
  if(nq===0){delete S.cart[id];delete S.subs[id]} else S.cart[id]=nq;
  save(); renderHeader(); renderView(); if($('#drawer').classList.contains('on')) renderCart();
}

/* ============ VISTAS ============ */
const TABS=[['inicio','Inicio'],['catalogo','Súper'],['pedidos','Pedidos'],['listas','Listas'],['negocios','Negocios'],['eco','Recompensas']];
function renderHeader(){
  $('#selProfile').innerHTML=Object.entries(PROFILES).map(([k,p])=>`<option value="${k}" ${k===S.profile?'selected':''}>${p.name}</option>`).join('');
  const n=Object.values(S.cart).reduce((a,b)=>a+b,0);
  $('#cartN').textContent=n;
  $('#cartTotal').textContent=n?money(totals().total):'Carrito';
  $('#hdrPts').textContent=U().points.toLocaleString('es-MX');
  $('#hdrStore').textContent='Sucursal '+STORES[S.store].name;
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button data-act="tab" data-v="${k}" class="${S.tab===k?'on':''}">${l}</button>`).join('');
}
function prodCard(p,why){
  const q=S.cart[p.id]||0, n=stockAt(p.id);
  return `<div class="prod" data-pid="${p.id}">
    ${img(p.id,n===0?'out':'',p.was?`<span class="badge pill sale">Ahorra ${money(p.was-p.price)}</span>`:'')}
    <div class="price">${money(p.price)}${p.was?`<s>${money(p.was)}</s>`:''}</div>
    <div class="nm">${esc(p.name)}</div>
    <div class="unit">${p.unit}</div>
    ${why?`<div class="why">${esc(why)}</div>`:''}
    <div class="stock">${stockTag(p.id)}</div>
    <div class="act">${q?`<div class="stepper"><button data-act="dec" data-id="${p.id}" aria-label="Quitar uno">${ic('minus')}</button><span>${q}</span><button data-act="inc" data-id="${p.id}" aria-label="Agregar uno">${ic('plus')}</button></div>`
      :`<button class="addb" data-act="inc" data-id="${p.id}" ${n===0?'disabled':''}>${n===0?'Sin existencia':'Agregar'}</button>`}</div>
  </div>`;
}
function liveTag(){const s=Math.max(1,Math.round((Date.now()-S.lastTick)/1000));return `<span class="live"><i></i>Inventario en vivo · hace ${s}s</span>`}

function vInicio(){
  const recs=recommendations(10), rep=replenish(), cps=coupons(), b2b=isB2B();
  const deals=PRODUCTS.filter(p=>p.was);
  return `
  <section class="hero">
    <div class="txt">
      <h1>${b2b?'Abastece tu negocio sin mínimos.':'Tu súper, como lo necesites.'}</h1>
      <p>${b2b?'Precio por volumen y disponibilidad garantizada por fecha.':'Disponibilidad real, envío en 60 minutos o pickup sin costo.'}</p>
      <div class="cta">
        <button class="btn light" data-act="tab" data-v="${b2b?'negocios':'catalogo'}">${b2b?'Planear pedido':'Comprar ahora'}</button>
        <button class="btn ghost" data-act="tab" data-v="${b2b?'catalogo':'listas'}">${b2b?'Ver catálogo':'Mis listas'}</button>
      </div>
    </div>
    <div class="pics">${['p01','p15','p08','p26'].map(id=>`<div><img src="img/${id}.webp" alt=""></div>`).join('')}</div>
  </section>

function planCheck(){
  const plan=S.plan, d=plan.date?new Date(plan.date+'T12:00').getTime():0, lines={};
  let total=0,saved=0,late=0;
  Object.entries(plan.items).forEach(([id,q])=>{
    if(!q)return; const p=P[id], pct=isB2B()?(q>=25?.1:q>=10?.05:0):0;
    total+=p.price*q*(1-pct); saved+=p.price*q*pct;
    const have=Object.values(S.stock[id]).reduce((a,b)=>a+b,0), need=Math.max(0,q-have);
    const eta=Date.now()+(need?Math.ceil(need/Math.max(10,p.base))*3*DAY:0);
    lines[id]={ok:need===0,need,eta};
    if(d&&eta>d) late=Math.max(late,eta);
  });
  return {lines,total,saved,late};
}
function weeklyTotals(){
  const arr={};
  history().forEach(o=>Object.entries(o.items).forEach(([id,q])=>{arr[id]=(arr[id]||0)+q}));
  const weeks=Math.max(1,(Date.now()-Math.min(...history().map(o=>o.date)))/(7*DAY));
  return {arr,weeks};
}
function weeklyUse(){
  const {arr,weeks}=weeklyTotals();
  const top=Object.keys(arr).map(id=>({id,w:arr[id]/weeks})).sort((a,b)=>b.w-a.w).slice(0,4), max=top[0]?top[0].w:1;
  return top.length?top.map(t=>`<div style="margin-top:12px"><div class="small" style="display:flex;justify-content:space-between"><span>${esc(P[t.id].name)}</span><b>${t.w.toFixed(1)}</b></div><div class="meter"><i style="width:${t.w/max*100}%"></i></div></div>`).join('')
    +`<button class="link" style="margin-top:14px" data-act="planFromUse">Usar como pedido base</button>`:'<p class="small muted">Sin historial.</p>';
}

    <label class="check"><span>Empaque ecológico<small>$5 · ganas 30 puntos</small></span><input type="checkbox" class="switch" data-eco ${c.eco?'checked':''}></label>
    <div><div class="lbl">Cupón</div>
      <select class="field" data-coupon aria-label="Cupón"><option value="">Sin cupón</option>${cps.map(x=>`<option value="${x.id}" ${c.coupon===x.id?'selected':''}>${esc(x.label)} · ${esc(x.desc)}</option>`).join('')}</select>
      ${t.cpNote?`<div class="small" style="color:var(--warn);margin-top:6px">${t.cpNote}</div>`:''}</div>
    `:`<div class="empty">Tu carrito está vacío.<br><br><button class="btn pri" data-act="tabClose" data-v="catalogo">Ir al súper</button></div>`}
  </div>
  ${t.lines.length?`<div class="df">
    <div class="tot"><span>Subtotal</span><span>${money(t.sub)}</span></div>
    ${t.tier?`<div class="tot g"><span>Volumen</span><span>−${money(t.tier)}</span></div>`:''}
    ${t.disc?`<div class="tot g"><span>Cupón</span><span>−${money(t.disc)}</span></div>`:''}
    <div class="tot"><span>${c.mode==='pickup'?'Pickup':'Envío'}</span><span>${t.fee?money(t.fee):'Gratis'}</span></div>
    ${t.eco?`<div class="tot"><span>Empaque eco</span><span>${money(t.eco)}</span></div>`:''}
    ${t.wallet?`<div class="tot g"><span>Saldo a favor</span><span>−${money(t.wallet)}</span></div>`:''}
    <div class="tot big"><span>Total</span><span>${money(t.total)}</span></div>
    <div class="small" style="color:var(--accent-ink);margin:2px 0 14px">${t.saved?`Ahorras ${money(t.saved)} · `:''}${t.pts} puntos</div>
    <button class="btn pri block" style="height:48px;font-size:15px" data-act="checkout">Pagar ${money(t.total)}</button>
  </div>`:''}`;
}

/* ============ ACCIONES ============ */
function openCart(){renderCart();$('#drawer').classList.add('on');$('#scrim').classList.add('on')}
function closeCart(){$('#drawer').classList.remove('on');$('#scrim').classList.remove('on')}
function findOrder(id,who){const u=who?S.users[who]:U();return u.orders.find(o=>o.id===id)}
function modal(html){$('#modalBody').innerHTML=html;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
function go(tab){S.tab=tab;save();renderHeader();renderView();window.scrollTo(0,0)}

function checkout(){
  const t=totals(); if(!t.lines.length)return;
  const subs=[];
  t.lines.forEach(({p,q})=>{const n=stockAt(p.id); if(q>n) subs.push({p,q,n,pref:S.subs[p.id]||'similar'})});
  const items={};
  t.lines.forEach(({p,q})=>{const take=Math.min(q,stockAt(p.id)); if(take) items[p.id]=take; S.stock[p.id][S.store]-=take});
  const u=U(), c=S.co;
  const o=mkOrder(items,{mode:c.mode,store:S.store,date:Date.now(),status:0,profile:S.profile,slot:c.slot});
  o.sub=t.sub; o.discount=t.tier+t.disc; o.fee=t.fee; o.total=t.total;
  u.orders.push(o); u.points+=t.pts; u.wallet-=t.wallet;
  if(c.eco) u.eco.ecoPack++;
  if(t.cp) u.usedCoupons.push(t.cp.id);
  S.cart={}; S.subs={}; c.coupon=null; c.eco=false;
  closeCart(); go('pedidos');
  const when=o.mode==='pickup'?`Recógelo en Sucursal ${STORES[o.store].name} en ${STORES[o.store].pick} minutos.`:o.mode==='b2b'?'Llega mañana de 7 a 9 h.':o.slot==='express'?'Llega en 60 minutos.':`Llega ${o.slot.toLowerCase()}.`;
  modal(`<div class="ok-ic">${ic('check')}</div><h2>Pedido confirmado</h2><p class="sub" style="margin:6px 0 16px">${when}</p>
    ${subs.length?`<div class="note" style="margin-bottom:14px">${ic('clock')}<span>El inventario cambió: ${subs.map(s=>`${esc(s.p.name)} (${s.n} de ${s.q}, ${s.pref==='similar'?'se sustituye':s.pref==='llamar'?'te llamamos':'no se cobra'})`).join(', ')}.</span></div>`:''}
    <div class="tot big" style="border-top:1px solid var(--line)"><span>Total</span><span>${money(o.total)}</span></div>
    <div class="small" style="color:var(--accent-ink);margin:4px 0 18px">+${t.pts} puntos${t.saved?` · ahorraste ${money(t.saved)}`:''}</div>
    <button class="btn pri block" data-act="closeModal">Ver pedido</button>`);
}
function issueModal(id){
  const o=findOrder(id);
  modal(`<h2>Reportar un problema</h2><p class="small muted" style="margin:4px 0 16px">Pedido ${o.id} · respuesta inmediata</p>
  <div style="display:flex;flex-direction:column;gap:12px">
    <label class="fl">Problema<select class="field" id="issType"><option>Producto faltante</option><option>Producto en mal estado</option><option>Llegó tarde</option><option>Sustitución incorrecta</option></select></label>
    <label class="fl">Producto<select class="field" id="issProd"><option value="">Todo el pedido</option>${Object.keys(o.items).map(pid=>`<option value="${pid}">${esc(P[pid].name)}</option>`).join('')}</select></label>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" data-act="sendIssue" data-id="${o.id}">Enviar</button></div>
  </div>`);
}
function sendIssue(id){
  const o=findOrder(id), type=$('#issType').value, prod=$('#issProd').value, u=U();
  let res;
  if(type==='Llegó tarde'){res='Te bonificamos 100 puntos.';u.points+=100}
  else{const amt=prod?P[prod].price*o.items[prod]:Math.round(o.total*.1); u.wallet+=amt; res=`Reembolso de ${money(amt)} como saldo.`}
  o.issues.push({type,prod,res}); save(); closeModal(); renderHeader(); renderView(); toast(res);
}
function storeModal(){
  modal(`<h2>Elige tu tienda</h2><p class="small muted" style="margin:4px 0 16px">El inventario y el pickup dependen de la sucursal.</p>
  <div style="display:flex;flex-direction:column;gap:8px">${Object.entries(STORES).map(([k,s])=>`<button class="mini" style="background:${k===S.store?'var(--bg-2)':'var(--bg)'};text-align:left;width:100%" data-act="setStore" data-v="${k}">
    ${ic('store')}<span class="t"><b>Sucursal ${s.name}</b><span class="small muted">Pickup en ${s.pick} min</span></span>${k===S.store?ic('check'):''}</button>`).join('')}</div>`);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act, id=b.dataset.id, u=U();
  switch(a){
    case 'tab': go(b.dataset.v); break;
    case 'tabClose': closeCart(); go(b.dataset.v); break;
    case 'goCat': S.cat=b.dataset.v; S.q=''; $('#q').value=''; go('catalogo'); break;
    case 'deals': S.cat='Todo'; S.q=''; $('#q').value=''; S.sort='deal'; go('catalogo'); break;
    case 'inc': addToCart(id,1); break;
    case 'dec': addToCart(id,-1); break;
    case 'incN': addToCart(id,+b.dataset.n); toast(`${P[id].name} agregado`); break;
    case 'addRep': replenish().forEach(r=>addToCart(r.id,r.q,true)); toast('Agregado al carrito'); break;
    case 'cat': S.cat=b.dataset.v; save(); renderView(); break;
    case 'openCart': openCart(); break;
    case 'closeCart': closeCart(); break;
    case 'closeModal': closeModal(); break;
    case 'checkout': checkout(); break;
    case 'mode': S.co.mode=b.dataset.v; save(); renderCart(); renderHeader(); break;
    case 'slot': S.co.slot=b.dataset.v; save(); renderCart(); renderHeader(); break;
    case 'useCoupon': S.co.coupon=id; save(); renderView(); renderHeader(); toast('Cupón activado'); break;
    case 'reorder': {const o=findOrder(id); Object.entries(o.items).forEach(([pid,q])=>addToCart(pid,q,true)); openCart(); break}
    case 'advance': {const o=findOrder(id,b.dataset.who); if(o.status<3)o.status++; save(); renderView(); break}
    case 'issue': issueModal(id); break;
    case 'sendIssue': sendIssue(id); break;
    case 'storeModal': storeModal(); break;
    case 'setStore': S.store=b.dataset.v;
      Object.keys(S.cart).forEach(pid=>{const n=stockAt(pid);if(S.cart[pid]>n){if(n)S.cart[pid]=n;else delete S.cart[pid]}});
      save(); closeModal(); renderHeader(); renderView(); toast('Sucursal '+STORES[S.store].name); break;
    case 'listToCart': Object.entries(u.lists[+b.dataset.i].items).forEach(([pid,q])=>addToCart(pid,q,true)); openCart(); break;
    case 'delList': u.lists.splice(+b.dataset.i,1); save(); renderView(); break;
    case 'saveCartList': modal(`<h2>Guardar lista</h2><label class="fl" style="margin:16px 0">Nombre<input class="field" id="listName" value="Lista ${u.lists.length+1}"></label><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" data-act="doSaveList">Guardar</button></div>`); break;
    case 'doSaveList': u.lists.push({name:$('#listName').value||'Mi lista',items:{...S.cart}}); save(); closeModal(); renderView(); toast('Lista guardada'); break;
    case 'eco': if(b.dataset.v==='bags'){u.eco.bags++;u.points+=20;toast('+20 puntos')} else {const n=Math.max(1,+$('#recN').value||0);u.eco.recycled+=n;u.points+=n*5;toast(`+${n*5} puntos`)} save(); renderHeader(); renderView(); break;
    case 'redeem': {const pts=+b.dataset.pts; if(u.points<pts)return; u.points-=pts; u.wallet+=+b.dataset.val; save(); renderHeader(); renderView(); toast(`${money(+b.dataset.val)} de saldo a favor`); break}
    case 'restock': S.stock[id][S.store]+=20; save(); renderView(); toast(`${P[id].name} +20`); break;
    case 'setProfile': S.profile=b.dataset.v; S.cart={}; save(); renderHeader(); renderView(); break;
    case 'kit': {const g=+($('#guests')||{}).value||0; if(!g){toast('Escribe el número de invitados');break}
      const per={p34:.25,p36:.15,p40:.2,p41:.1,p37:.5,p45:.05,p20:.1,p17:.04}; S.plan.items={};
      Object.entries(per).forEach(([pid,f])=>S.plan.items[pid]=Math.max(1,Math.ceil(g*f))); save(); renderView(); toast(`Cantidades para ${g} invitados`); break}
    case 'planFromUse': {const {arr,weeks}=weeklyTotals(); S.plan.items={};
      Object.entries(arr).forEach(([pid,q])=>{if(P[pid].b2b)S.plan.items[pid]=Math.ceil(q/weeks)}); save(); renderView(); toast('Pedido base cargado'); break}
    case 'confirmPlan': {const ck=planCheck(), items={};
      Object.entries(S.plan.items).forEach(([pid,q])=>{if(q)items[pid]=q});
      const o=mkOrder(items,{mode:'b2b',store:S.store,date:Date.now(),status:-1,profile:S.profile,forDate:new Date(S.plan.date+'T12:00').getTime()});
      o.total=ck.total; o.discount=ck.saved; o.recur=S.plan.recur;
      u.orders.push(o); u.scheduled.push({forDate:o.forDate,recur:S.plan.recur,total:ck.total}); u.points+=Math.floor(ck.total/10);
      S.plan={date:'',recur:'una',items:{}}; save(); renderHeader(); renderView();
      modal(`<div class="ok-ic">${ic('check')}</div><h2>Pedido programado</h2><p class="sub" style="margin:6px 0 16px">Inventario apartado para el ${fmtDate(o.forDate)}${o.recur!=='una'?`, se repite ${o.recur}`:''}. Te avisamos 24 h antes.</p><div class="tot big" style="border-top:1px solid var(--line)"><span>Total</span><span>${money(o.total)}</span></div><button class="btn pri block" style="margin-top:16px" data-act="closeModal">Listo</button>`); break}
    case 'reset': if(confirm('¿Reiniciar los datos de la demo?')){S=freshState();save();closeCart();$('#q').value='';renderHeader();renderView()} break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='selProfile'){S.profile=t.value;S.co.coupon=null;save();renderHeader();renderView();if($('#drawer').classList.contains('on'))renderCart();return}
  if(t.id==='sort'){S.sort=t.value;save();renderView();return}
  if(t.hasAttribute('data-eco')){S.co.eco=t.checked;save();renderCart();renderHeader();return}
  if(t.hasAttribute('data-coupon')){S.co.coupon=t.value||null;save();renderCart();renderHeader();return}
  if(t.dataset.sub){S.subs[t.dataset.sub]=t.value;save();return}
  if(t.id==='planDate'){S.plan.date=t.value;save();renderView();return}
  if(t.id==='planRecur'){S.plan.recur=t.value;save();return}
  if(t.dataset.plan){S.plan.items[t.dataset.plan]=Math.max(0,parseInt(t.value)||0);save();renderView();return}
});
$('#q').addEventListener('input',e=>{S.q=e.target.value;if(S.tab!=='catalogo'){S.tab='catalogo';S.cat='Todo';renderHeader()}renderView()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeCart();closeModal()}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* Inventario en vivo: compras y reabastos simulados */
setInterval(()=>{
  const r=Math.random, changed=[];
  for(let i=0;i<3;i++){
    const p=PRODUCTS[Math.floor(r()*PRODUCTS.length)], st=Object.keys(STORES)[Math.floor(r()*3)];
    if(r()<.75) S.stock[p.id][st]=Math.max(0,S.stock[p.id][st]-Math.ceil(r()*3)); else S.stock[p.id][st]+=Math.ceil(r()*6);
    if(st===S.store) changed.push(p.id);
  }
  S.lastTick=Date.now(); save();
  if(['inicio','catalogo','tienda'].includes(S.tab)&&!document.activeElement.matches('input,select,textarea')&&!$('#modal').classList.contains('on')){
    const y=window.scrollY, rails=[...document.querySelectorAll('.rail')].map(r=>r.scrollLeft);
    renderView(); window.scrollTo(0,y); document.querySelectorAll('.rail').forEach((r,i)=>r.scrollLeft=rails[i]||0);
    changed.forEach(id=>document.querySelectorAll(`.prod[data-pid="${id}"] .stock`).forEach(el=>el.classList.add('flash')));
  }
},15000);
setInterval(()=>{const s=Math.max(1,Math.round((Date.now()-S.lastTick)/1000));document.querySelectorAll('.live').forEach(el=>{el.lastChild.textContent=`Inventario en vivo · hace ${s}s`})},1000);

load(); $('#q').value=S.q; renderHeader(); renderView();
</script>
